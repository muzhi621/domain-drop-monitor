name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install worker dependencies
        working-directory: worker
        run: npm install

      - name: Create D1 database (first run only)
        working-directory: worker
        # Safe to run repeatedly; prints the DB id you must paste into wrangler.toml once.
        run: npx wrangler d1 create domain_monitor || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Apply D1 migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply domain_monitor --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Set Cloudflare Secrets
        working-directory: worker
        run: |
          echo "${{ secrets.ADMIN_PASSWORD }}"      | npx wrangler secret put ADMIN_PASSWORD
          echo "${{ secrets.SESSION_SECRET }}"      | npx wrangler secret put SESSION_SECRET
          echo "${{ secrets.RESEND_API_KEY }}"      | npx wrangler secret put RESEND_API_KEY
          echo "${{ secrets.TG_BOT_TOKEN }}"        | npx wrangler secret put TG_BOT_TOKEN
          echo "${{ secrets.TG_CHAT_ID }}"          | npx wrangler secret put TG_CHAT_ID
          echo "${{ secrets.PUSHPLUS_TOKEN }}"      | npx wrangler secret put PUSHPLUS_TOKEN
          echo "${{ secrets.NOTIF_WEBHOOK_URL }}"   | npx wrangler secret put NOTIF_WEBHOOK_URL
          echo "${{ secrets.WECOM_WEBHOOK_URL }}"   | npx wrangler secret put WECOM_WEBHOOK_URL
          echo "${{ secrets.WHOIS_API_BASE }}"      | npx wrangler secret put WHOIS_API_BASE
          echo "${{ secrets.WHOIS_API_KEY }}"       | npx wrangler secret put WHOIS_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
